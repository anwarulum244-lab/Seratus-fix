name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek dari zip
        run: |
          unzip -q ./*.zip -d project
          ls -a project

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install system dependencies (Chrome + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 \
            fonts-noto-core

      - name: Install dependencies
        working-directory: project
        run: npm ci

      - name: Typecheck
        working-directory: project
        run: npm run typecheck

      - name: Render video
        working-directory: project
        run: |
          mkdir -p out
          npx remotion render src/index.ts SeratusTahun out/100-tahun.mp4 \
            --codec=h264 --audio-codec=aac --crf=18 --concurrency=100%

      - name: Video info
        working-directory: project
        run: npx remotion ffprobe -hide_banner out/100-tahun.mp4 || true

      - uses: actions/upload-artifact@v4
        with:
          name: 100-tahun-mp4
          path: project/out/100-tahun.mp4
          retention-days: 14
          if-no-files-found: error
